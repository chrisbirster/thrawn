name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check build.zig src tests examples

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-aarch64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Zig version
        run: zig version
      - name: Build debug
        run: zig build
      - name: Test debug
        run: zig build test
      - name: Compile examples debug
        run: zig build examples
      - name: Consumer package smoke test
        working-directory: tests/consumer
        run: zig build
      - name: Root help smoke test
        run: zig build run -- --help
      - name: Nested command smoke test
        run: zig build run -- fleet status
      - name: Global option smoke test
        run: zig build run -- --verbose fleet status
      - name: Option syntax smoke test
        run: zig build run -- fleet deploy destroyer -nr3 -talpha --tag=beta
      - name: Passthrough smoke test
        run: zig build run -- exec node --inspect index.js
      - name: Completion protocol smoke test
        run: zig build run -- --thrawn-complete fleet de
      - name: Generated docs smoke test
        run: zig build docs
      - name: Build release-safe
        run: zig build -Doptimize=ReleaseSafe
      - name: Test release-safe
        run: zig build test -Doptimize=ReleaseSafe
      - name: Compile examples release-safe
        run: zig build examples -Doptimize=ReleaseSafe
      - name: Consumer package release-safe
        working-directory: tests/consumer
        run: zig build -Doptimize=ReleaseSafe
